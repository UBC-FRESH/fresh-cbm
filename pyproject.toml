[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-cbm"
version = "0.1.0"
description = "Exact cached libcbm stand-state tables for WS4/FEMIC carbon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15"]

[tool.setuptools.packages.find]
include = ["fresh_cbm*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "fresh_cbm"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
