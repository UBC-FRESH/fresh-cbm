[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fresh-cbm"
version = "0.1.0"
description = "Exact cached libcbm stand-state tables for WS4/FEMIC carbon"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "jsonschema>=4.20"]

[project.scripts]
fresh-cbm-build = "fresh_cbm.build:main"
fresh-cbm-validate = "fresh_cbm.validate:main"
fresh-cbm-package = "fresh_cbm.release:main"
fresh-cbm-bench = "fresh_cbm.benchmark:main"
fresh-cbm-verify = "fresh_cbm.verify:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
  "numpydoc>=1.7",
  "hypothesis>=6.100",
  "types-jsonschema",
  "pandas-stubs",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]

[tool.setuptools.packages.find]
include = ["fresh_cbm*"]

[tool.setuptools.package-data]
fresh_cbm = ["manifest.schema.json"]

[tool.mypy]
strict = true
files = ["fresh_cbm", "scripts", "tests", "docs/conf.py"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ws4", "ws4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "fresh_cbm"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fresh_cbm --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["fresh_cbm"]

[tool.coverage.report]
show_missing = true
