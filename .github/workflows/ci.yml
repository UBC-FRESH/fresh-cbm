name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Console entry points
        run: |
          fresh-cbm-build --help
          fresh-cbm-validate --help
          fresh-cbm-package --help

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Types (mypy --strict)
        run: python -m mypy

      - name: Tests with coverage gate
        run: python -m pytest

      - name: Validate workflow surfaces
        run: python scripts/check_workflow.py

      - name: Build docs with warnings as errors
        run: sphinx-build -b html docs _build/html -W

      - name: Build package
        run: python -m build

  package-smoke:
    name: Wheel and sdist install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/fresh-cbm-build --help
          /tmp/wheel-venv/bin/fresh-cbm-validate --help
          /tmp/wheel-venv/bin/fresh-cbm-package --help
          /tmp/wheel-venv/bin/fresh-cbm-bench --help
          /tmp/wheel-venv/bin/fresh-cbm-verify --help
      - name: Install sdist
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/fresh-cbm-verify --help

  dashboard:
    name: Green dashboard summary
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the dashboard
        shell: bash
        run: |
          set +e
          mkdir -p runtime
          python scripts/dashboard.py --markdown --json runtime/dashboard.json > runtime/dashboard.md
          status=$?
          cat runtime/dashboard.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the dashboard record
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-record
          path: runtime/dashboard.json

  pre-commit:
    name: Pre-commit parity
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure
